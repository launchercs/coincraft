<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه پیدا نشد | CoinCraft</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="glitch-page">

    <div id="particles"></div>
    <div class="glitch-scanlines"></div>
    <div class="glitch-noise"></div>

    <header>
        <div class="container header-flex">
            <div class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">CoinCraft</span>
            </div>
        </div>
    </header>

    <section class="error-page glitch-error">
        <div class="container error-content">
            <div class="error-icon glitch-icon"></div>

            <h1 class="error-code glitch-text" data-text="404">404</h1>
            <h2 class="error-title glitch-text" data-text="صفحه پیدا نشد!">صفحه پیدا نشد!</h2>

            <p class="error-desc glitch-flicker">
                سیگنال قطع شد... صفحه‌ای که به دنبال آن هستید وجود ندارد یا جابجا شده است.
            </p>

            <div class="glitch-actions">
                <a href="index.html" class="btn btn-primary glitch-btn">🏠 بازگشت به خانه</a>
                <button class="btn btn-outline glitch-btn" id="glitch-random">⚡ چرخش تصادفی</button>
            </div>

            <div class="glitch-terminal">
                <span class="terminal-prompt">&gt;</span>
                <span class="terminal-text" id="terminal-text">ERROR_404: PAGE_NOT_FOUND</span>
                <span class="terminal-cursor">▊</span>
            </div>
        </div>
    </section>

    <footer>
        <div class="container footer-bottom">
            <p>&copy; ۲۰۲۶ CoinCraft. تمامی حقوق محفوظ است.</p>
        </div>
    </footer>

    <div id="toast"></div>
    <script src="script.js"></script>
</body>
</html>
